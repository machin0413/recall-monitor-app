# XcodeGen のプロジェクト定義。
#   brew install xcodegen
#   xcodegen generate    → RecallMonitor.xcodeproj を生成
#
# .xcodeproj は生成物なのでコミットしない（project.pbxproj は差分が読めないため）。
# Swift ファイルを追加したら xcodegen generate を実行し直すこと。

name: RecallMonitor

options:
  bundleIdPrefix: jp.recallmonitor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 並行処理の警告を拾えるようにしておく（@MainActor まわりの取りこぼし対策）
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RecallMonitor:
    type: application
    platform: iOS
    sources:
      - path: ios/RecallMonitor
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: RecallMonitor
        PRODUCT_BUNDLE_IDENTIFIER: jp.recallmonitor.app
        INFOPLIST_FILE: ios/RecallMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # iPhone のみ
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 実機ビルド時は自分の Team ID を入れるか、Xcode の Signing & Capabilities で選ぶ
        DEVELOPMENT_TEAM: ""

# XcodeGen は既定でスキームを生成しない。
# xcodebuild -scheme RecallMonitor を使うために明示する。
schemes:
  RecallMonitor:
    build:
      targets:
        RecallMonitor: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
