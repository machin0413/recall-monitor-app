name: check-api

# 国土交通省 renrakuda API のカナリア。
#
# アプリは配信サーバーを持たず API を直接呼ぶため、サイト仕様が変わると
# 全端末が同時に壊れる。しかも気づく手段がユーザーからの報告しかない。
# 毎日検査し、壊れていたら Issue を立てて気づけるようにする。
on:
  schedule:
    # 毎日 07:20 JST (22:20 UTC)。国交省側は 18時〜翌8時頃が更新帯なので
    # その直後を狙う。GitHub の実行は数十分ずれることがある。
    - cron: "20 22 * * *"
  push:
    branches: [main]
    paths:
      - config.json
      - scripts/check_api.py
      - ios/RecallMonitor/Services/RecallAPIClient.swift
      - ios/RecallMonitor/Services/RemoteConfig.swift
      - .github/workflows/check-api.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-api
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API の仕様を検査
        run: python3 scripts/check_api.py

      - name: 失敗したら Issue を立てる
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '国交省 API の仕様変更を検知しました';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-breakage',
            });
            const body = [
              'カナリア (`scripts/check_api.py`) が失敗しました。',
              '',
              'アプリは国交省 API を直接呼んでいるため、この状態では**全端末でリコール検索ができません**。',
              'ユーザーからは「該当なし」と見えることもあり、その場合は誤答として現れます。',
              '',
              `実行ログ: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '## 対応',
              '1. ログでどの検査が落ちたかを確認する',
              '2. エンドポイントやパラメータ名の変更なら **`config.json` を直して main に push** する。',
              '   アプリは起動時にこれを読むため、App Store 更新なしで全端末が復旧する（反映は最大5分）。',
              '   `RemoteConfig.swift` の `builtIn` も同じ値に揃えること（新規インストール時に使われる）。',
              '3. レスポンスのフィールド名が変わった場合は config.json では吸収できない。',
              '   `RecallAPIClient.swift` のデコーダ修正が要るため、App Store 更新が必要。',
              '4. 判定に関わる変更なら `RecallMatcher.swift` も見直す。',
              '',
              '**急ぎの場合**: `config.json` の `notice` に文言を入れて push すると、',
              'アプリの検索画面に周知を出せる。復旧までの間の案内に使う。',
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `再検知しました。\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['api-breakage'],
                body,
              });
            }
