name: probe-api

# 国交省 renrakuda の実 API 仕様を GitHub Actions ランナーから調査するための
# 診断用ワークフロー。開発ブランチへの push か手動実行で走る。
on:
  push:
    branches:
      - claude/app-development-hhbu4f
    paths:
      - backend/probe_api.py
      - backend/probe_browser.py
      - .github/workflows/probe-api.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: renrakuda API 調査
        run: python3 backend/probe_api.py

      - name: Playwright 準備
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 実ブラウザからの到達性を確認
        run: python3 backend/probe_browser.py
